<svg xmlns="http://www.w3.org/2000/svg" width="960" height="720" viewBox="0 0 960 720" role="img" aria-labelledby="title desc">
<title id="title">From experience to the next session</title><desc id="desc">Capture evidence, review candidate lessons against their sources, retain scoped knowledge, and retrieve it for a new task. Evaluate the next session and feed its results back into review.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0d1c2e"/><stop offset="1" stop-color="#18233c"/></linearGradient><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#6ee7cf" stroke-width="1.5"/></marker></defs>
<rect width="960" height="720" rx="24" fill="url(#bg)"/>
<g font-family="Arial, sans-serif"><text x="56" y="57" fill="#6ee7cf" font-size="16" letter-spacing="3">A PRACTICAL MEMORY WORKFLOW</text><text x="56" y="106" fill="#f0f5ff" font-size="34" font-weight="700">Experience becomes a useful lesson.</text>
<g fill="#142b3b" stroke="#395769"><rect x="56" y="150" width="392" height="186" rx="18"/><rect x="512" y="150" width="392" height="186" rx="18"/><rect x="512" y="400" width="392" height="186" rx="18"/><rect x="56" y="400" width="392" height="186" rx="18"/></g>
<g fill="#6ee7cf" font-size="16" letter-spacing="2"><text x="84" y="186">01 / CAPTURE</text><text x="540" y="186">02 / REVIEW</text><text x="540" y="436">03 / RETAIN</text><text x="84" y="436">04 / RETRIEVE</text></g>
<g fill="#f0f5ff" font-size="27" font-weight="700"><text x="84" y="232">Keep the evidence</text><text x="540" y="232">Check the lesson</text><text x="540" y="482">Save with context</text><text x="84" y="482">Help the next task</text></g>
<g fill="#c0d0e1" font-size="20"><text x="84" y="272">Tool results, outcomes, sources</text><text x="84" y="303">What actually happened?</text><text x="540" y="272">Verify claims and conflicts</text><text x="540" y="303">What does the evidence support?</text><text x="540" y="522">Scope, status, source, version</text><text x="540" y="553">When does this lesson apply?</text><text x="84" y="522">Load relevant knowledge</text><text x="84" y="553">Does it improve the outcome?</text></g>
<g fill="none" stroke="#6ee7cf" stroke-width="2.5" marker-end="url(#arrow)"><path d="M455 243H499"/><path d="M708 344V387"/><path d="M503 493H461"/></g>
<path d="M252 594V632H930V243H913" fill="none" stroke="#b5a6ed" stroke-width="2" stroke-dasharray="7 6"/>
<text x="56" y="677" fill="#b5a6ed" font-size="19">Feedback: evaluate future results and revisit the lesson.</text>
</g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title description">
  <title id="title">How a turn flows through an agent harness</title>
  <desc id="description">A user message enters the harness, which assembles context and calls the model. The model may request a tool, whose result is returned through the harness, before producing a final response that is appended to the conversation.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="0.52" stop-color="#172554"/>
      <stop offset="1" stop-color="#2e1065"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#020617" flood-opacity="0.45"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#93c5fd"/>
    </marker>
  </defs>

  <rect width="1200" height="675" rx="28" fill="url(#background)"/>
  <circle cx="1040" cy="95" r="170" fill="#7c3aed" opacity="0.12"/>
  <circle cx="110" cy="625" r="210" fill="#2563eb" opacity="0.12"/>

  <text x="70" y="84" fill="#f8fafc" font-family="Arial, sans-serif" font-size="38" font-weight="700">One agent turn, step by step</text>
  <text x="70" y="122" fill="#bfdbfe" font-family="Arial, sans-serif" font-size="20">The harness carries state by rebuilding the model's input.</text>

  <g filter="url(#shadow)">
    <rect x="70" y="205" width="200" height="130" rx="18" fill="#172033" stroke="#60a5fa" stroke-width="2"/>
    <rect x="360" y="180" width="270" height="180" rx="18" fill="#172033" stroke="#818cf8" stroke-width="2"/>
    <rect x="720" y="205" width="200" height="130" rx="18" fill="#172033" stroke="#a78bfa" stroke-width="2"/>
    <rect x="720" y="455" width="200" height="110" rx="18" fill="#172033" stroke="#34d399" stroke-width="2"/>
  </g>

  <text x="170" y="250" text-anchor="middle" fill="#f8fafc" font-family="Arial, sans-serif" font-size="25" font-weight="700">User</text>
  <text x="170" y="284" text-anchor="middle" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="18">New message</text>

  <text x="495" y="222" text-anchor="middle" fill="#f8fafc" font-family="Arial, sans-serif" font-size="25" font-weight="700">Agent harness</text>
  <text x="495" y="258" text-anchor="middle" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="17">Instructions + history</text>
  <text x="495" y="286" text-anchor="middle" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="17">+ tool results + message</text>
  <rect x="408" y="310" width="174" height="28" rx="14" fill="url(#accent)" opacity="0.9"/>
  <text x="495" y="330" text-anchor="middle" fill="#0f172a" font-family="Arial, sans-serif" font-size="14" font-weight="700">ASSEMBLE CONTEXT</text>

  <text x="820" y="250" text-anchor="middle" fill="#f8fafc" font-family="Arial, sans-serif" font-size="25" font-weight="700">Model</text>
  <text x="820" y="284" text-anchor="middle" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="18">Next action</text>

  <text x="820" y="498" text-anchor="middle" fill="#f8fafc" font-family="Arial, sans-serif" font-size="24" font-weight="700">Tool</text>
  <text x="820" y="530" text-anchor="middle" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="17">Result returns to context</text>

  <path d="M270 270 H350" fill="none" stroke="#93c5fd" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M630 270 H710" fill="none" stroke="#93c5fd" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M820 345 V445" fill="none" stroke="#6ee7b7" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M710 510 C565 510 575 390 620 350" fill="none" stroke="#6ee7b7" stroke-width="4" stroke-dasharray="9 9" marker-end="url(#arrow)"/>

  <path d="M930 270 H1080 V610 H170 V348" fill="none" stroke="#c4b5fd" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="935" y="398" width="205" height="72" rx="15" fill="#312e81" stroke="#c4b5fd"/>
  <text x="1038" y="426" text-anchor="middle" fill="#f8fafc" font-family="Arial, sans-serif" font-size="17" font-weight="700">Final response</text>
  <text x="1038" y="450" text-anchor="middle" fill="#ddd6fe" font-family="Arial, sans-serif" font-size="15">Append to transcript</text>

  <text x="70" y="630" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="17">Each model call is stateless. Continuity comes from the context the harness sends again.</text>
</svg>
